name: One-time release hardening

# This branch-local workflow is intentionally removed by the hardening helper.
on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  harden:
    if: ${{ github.head_ref == 'chore/release-hardening-v1' && !contains(github.event.pull_request.head.sha, '[hardening-applied]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out hardening branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: chore/release-hardening-v1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Apply MCP 2026-07-28 compatibility patch
        run: echo "The main-branch release-hardening helper owns the verified patch."
