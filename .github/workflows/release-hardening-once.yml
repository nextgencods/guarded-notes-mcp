name: One-time release hardening

# Branch-local trigger; removed automatically after the verified hardening patch.
# Retry 2 uses the corrected main-branch hardening helper.
on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  harden:
    if: ${{ github.head_ref == 'chore/release-hardening-v1' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: No-op branch trigger
        run: echo "The main-branch release-hardening helper owns the verified patch."
