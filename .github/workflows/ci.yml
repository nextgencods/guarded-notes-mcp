name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portable:
    name: Portable checks (Node ${{ matrix.node-version }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node-version:
          - "22"
          - "24"
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          package-manager-cache: false

      - name: Prepare isolated test directories
        env:
          TEST_HOME: ${{ runner.temp }}/guarded-notes-home
          TEST_TMPDIR: ${{ runner.temp }}/guarded-notes-tmp
        run: mkdir -p "$TEST_HOME" "$TEST_TMPDIR"

      - name: Validate repository and JavaScript syntax
        env:
          HOME: ${{ runner.temp }}/guarded-notes-home
          TMPDIR: ${{ runner.temp }}/guarded-notes-tmp
        run: node scripts/validate-repository.mjs

      - name: Run portable safety and protocol tests
        env:
          HOME: ${{ runner.temp }}/guarded-notes-home
          TMPDIR: ${{ runner.temp }}/guarded-notes-tmp
        run: node --test tests/portable.test.mjs

  macos:
    name: macOS automation compilation (Node 22)
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Prepare isolated test directories
        env:
          TEST_HOME: ${{ runner.temp }}/guarded-notes-home
          TEST_TMPDIR: ${{ runner.temp }}/guarded-notes-tmp
        run: mkdir -p "$TEST_HOME" "$TEST_TMPDIR"

      - name: Validate repository and JavaScript syntax
        env:
          HOME: ${{ runner.temp }}/guarded-notes-home
          TMPDIR: ${{ runner.temp }}/guarded-notes-tmp
        run: node scripts/validate-repository.mjs

      - name: Run portable safety and protocol tests
        env:
          HOME: ${{ runner.temp }}/guarded-notes-home
          TMPDIR: ${{ runner.temp }}/guarded-notes-tmp
        run: node --test tests/portable.test.mjs

      - name: Compile Apple automation and run macOS self-test
        env:
          HOME: ${{ runner.temp }}/guarded-notes-home
          TMPDIR: ${{ runner.temp }}/guarded-notes-tmp
        run: node plugins/guarded-notes-mcp/tests/self-test.mjs
