name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    name: Verify release candidate
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  release:
    name: Publish GitHub release
    needs: ci
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Validate tag and version metadata
        id: metadata
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          node scripts/validate-repository.mjs --tag "$RELEASE_TAG"
          version="${RELEASE_TAG#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build deterministic source archives
        env:
          VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          set -euo pipefail
          archive_root="guarded-notes-mcp-$VERSION"
          mkdir -p dist
          git archive --format=tar.gz --prefix="$archive_root/" --output="dist/$archive_root.tar.gz" HEAD
          git archive --format=zip --prefix="$archive_root/" --output="dist/$archive_root.zip" HEAD
          (
            cd dist
            sha256sum "$archive_root.tar.gz" "$archive_root.zip" > SHA256SUMS.txt
          )
          tar -tzf "dist/$archive_root.tar.gz" | grep -Fx "$archive_root/plugins/guarded-notes-mcp/.codex-plugin/plugin.json"
          unzip -Z1 "dist/$archive_root.zip" | grep -Fx "$archive_root/plugins/guarded-notes-mcp/.codex-plugin/plugin.json"

      - name: Publish release and checksums
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.metadata.outputs.version }}
        run: |
          set -euo pipefail
          archive_root="guarded-notes-mcp-$VERSION"
          release_kind=(--latest)
          if [[ "$VERSION" == *-* ]]; then
            release_kind=(--prerelease)
          fi
          gh release create "$RELEASE_TAG" \
            "dist/$archive_root.tar.gz" \
            "dist/$archive_root.zip" \
            "dist/SHA256SUMS.txt" \
            --verify-tag \
            --generate-notes \
            "${release_kind[@]}" \
            --title "Guarded Notes MCP $VERSION"
